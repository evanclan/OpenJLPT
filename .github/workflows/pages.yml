name: Website

# Builds the static site (scripts/build-site.ts) and deploys it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['data/**', 'site/**', 'scripts/build-site.ts', 'scripts/build_exports.py', '.github/workflows/pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: npx tsx scripts/build-site.ts _site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build Anki decks and Yomitan dictionary
        run: |
          pip install genanki
          python scripts/build_exports.py _site/downloads
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
