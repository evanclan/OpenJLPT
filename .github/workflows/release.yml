name: Release

# Push a tag like v0.3.0 to publish a release:
#  - GitHub Release with Anki decks, the Yomitan dictionary and a data bundle
#  - npm (needs an NPM_TOKEN repository secret)
#  - PyPI via trusted publishing (configure it on pypi.org, then set the
#    repository variable PYPI_TRUSTED_PUBLISHING=true)
#  - Hugging Face Datasets (set the HF_TOKEN secret, a write token, and the
#    HF_DATASET_REPO variable, e.g. your-name/openjlpt)
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A step's `if:` can't see secrets directly, so expose whether one is set.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      HAS_HF_TOKEN: ${{ secrets.HF_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run validate && npm test
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          grep -q "^version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml

      - name: Build Anki decks, Yomitan dictionary and data bundle
        run: |
          pip install genanki build
          python scripts/build_exports.py release
          (cd data && zip -qr ../release/openjlpt-data.zip json csv openjlpt.sqlite)
          python -m build --outdir python-dist

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            📦 **Downloads:** Anki decks per level (`openjlpt-<level>-<kind>.apkg`) or all in one (`openjlpt-complete.apkg`),
            the Yomitan JLPT-level dictionary (`openjlpt-yomitan.zip`) and the full dataset (`openjlpt-data.zip`: JSON, CSV, SQLite).

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed.

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_TRUSTED_PUBLISHING == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist

      - name: Publish the dataset to Hugging Face
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_HF_TOKEN == 'true' && vars.HF_DATASET_REPO != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          pip install -U huggingface_hub
          mkdir -p hf-upload/data
          cp -r data/json data/csv hf-upload/data/
          sed "s#OpenJLPT/openjlpt#${HF_REPO}#g" hf/README.md > hf-upload/README.md
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi()
          repo = os.environ["HF_REPO"]
          api.create_repo(repo, repo_type="dataset", exist_ok=True)
          api.upload_folder(repo_id=repo, repo_type="dataset", folder_path="hf-upload",
                            commit_message=f"OpenJLPT {os.environ['GITHUB_REF_NAME']}")
          PY
